<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VaultDesk">
  <meta name="theme-color" content="#0f1419">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>VaultDesk</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme-nexttoken.css">
</head>
<body>
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">◈</div>
        <div class="brand-info">
          <div class="eyebrow">LOCAL KNOWLEDGE VAULT</div>
          <strong>VaultDesk</strong>
        </div>
      </div>

      <div class="vault-status">
        <span class="status-dot"></span>
        <span data-i18n="本机运行 · 可写入 vault">本机运行 · 可写入 vault</span>
      </div>

      <!-- Quick Action in Sidebar -->
      <button class="new-note-btn" id="newNoteBtn">
        <span>＋</span> <span data-i18n="新建笔记">新建笔记</span>
      </button>

      <!-- Global Search -->
      <label class="search-box">
        <span class="search-icon">⌕</span>
        <input id="search" placeholder="搜索笔记、路径或标签" data-i18n-ph="搜索笔记、路径或标签" autocomplete="off">
        <kbd>⌘ K</kbd>
      </label>

      <!-- Primary Sidebar Nav -->
      <div class="section-label" data-i18n="核心模块">核心模块</div>
      <nav class="nav-menu">
        <button class="nav-item active" data-nav="daily" id="navDaily">
          <span class="nav-icon">📅</span>
          <span class="nav-title" data-i18n="每日日记">每日日记</span>
          <em class="nav-badge" id="dailyDateBadge" data-i18n="今天">今天</em>
        </button>
        <button class="nav-item" data-nav="tasks" id="navTasks">
          <span class="nav-icon">✅</span>
          <span class="nav-title" data-i18n="事项清单">事项清单</span>
          <em class="nav-badge" id="sidebarTaskBadge" hidden>0</em>
        </button>
        <button class="nav-item" data-nav="feeds" id="navFeeds">
          <span class="nav-icon">📡</span>
          <span class="nav-title" data-i18n="资讯聚合">资讯聚合</span>
          <em class="nav-badge" id="sidebarFeedBadge" hidden>0</em>
        </button>
        <button class="nav-item" data-nav="all" id="navAll">
          <span class="nav-icon">▦</span>
          <span class="nav-title" data-i18n="全部笔记">全部笔记</span>
          <em class="nav-badge" id="allCount">—</em>
        </button>
        <button class="nav-item" data-nav="chat" id="navChat">
          <span class="nav-icon">💬</span>
          <span class="nav-title" data-i18n="知识问答">知识问答</span>
          <em class="nav-badge">RAG</em>
        </button>
        <button class="nav-item" data-nav="settings" id="navSettings">
          <span class="nav-icon">⚙</span>
          <span class="nav-title" data-i18n="系统设置">系统设置</span>
        </button>
      </nav>

      <!-- Calendar Widget in Sidebar -->
      <div class="sidebar-calendar-widget">
        <div class="calendar-head">
          <span class="cal-title" data-i18n="日历快速跳转">日历快速跳转</span>
          <button class="cal-today-btn" id="sideTodayBtn" data-i18n="回到今天">回到今天</button>
        </div>
        <div class="calendar-input-wrap">
          <input type="date" id="sideDailyDate" class="cal-date-input">
        </div>
        <div class="calendar-hint" id="sideDailyHint" data-i18n="选择日期查看当日日记">选择日期查看当日日记</div>
      </div>

      <!-- Folders section: occupies remaining height, scrolls internally -->
      <div class="vault-section">
        <div class="section-label" data-i18n="Vault 目录">Vault 目录</div>
        <div id="folders" class="folder-list"></div>
      </div>

      <!-- Language switcher -->
      <div class="lang-switch">
        <span class="lang-icon">🌐</span>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <!-- Sidebar footer -->
      <div class="sidebar-foot">
        <span id="vaultNameLabel" data-i18n="Markdown vault">Markdown vault</span>
        <span id="syncTime" data-i18n="正在读取…">正在读取…</span>
      </div>
    </aside>

    <!-- Main Workspace on the Right -->
    <main class="main">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="menu" title="打开侧边栏" data-i18n-title="打开侧边栏">☰</button>
          <button class="icon-btn" id="btnNavBack" title="返回上一页" data-i18n-title="返回上一页" aria-label="返回上一页" disabled>←</button>
          <button class="icon-btn" id="btnNavForward" title="前进一页" data-i18n-title="前进一页" aria-label="前进一页" disabled>→</button>
          <div class="crumb" id="crumb">
            <span class="crumb-section" id="crumbSection">日记</span>
            <span class="crumb-sep">/</span>
            <span class="crumb-target" id="crumbTarget">今日</span>
          </div>
        </div>

        <!-- Topbar Right Actions -->
        <div class="top-actions">
          <button class="icon-btn" id="toggleFocus" title="专注阅读模式" data-i18n-title="专注阅读模式">⤢</button>
          <button class="icon-btn" id="toggleTheme" title="切换柔和配色" data-i18n-title="切换柔和配色">◐</button>
        </div>
      </header>

      <!-- Main Content Container -->
      <div class="content-container">

        <!-- ================= PANE 1: DAILY VIEW (日记专属区域) ================= -->
        <div class="view-pane active" id="paneDaily">
          <div class="daily-container" id="dailyContainer">
            <!-- Rendered by renderDaily() -->
          </div>
        </div>

        <!-- ================= PANE 2: TASKS VIEW (事项专属区域) ================= -->
        <div class="view-pane" id="paneTasks">
          <div class="tasks-container" id="tasksContainer">
            <!-- Rendered by renderTasksView() -->
          </div>
        </div>

        <!-- ================= PANE 5: FEEDS VIEW (📡 资讯聚合) ================= -->
        <div class="view-pane" id="paneFeeds">
          <div class="feeds-workspace">
            <section class="feeds-pane-toolbar">
              <div class="feeds-toolbar-left">
                <button class="btn btn-secondary feed-refresh-btn" id="btnRefreshFeeds" data-i18n="🔄 刷新">🔄 刷新</button>
                <button class="btn btn-secondary feed-unread-toggle" id="btnFeedUnread" data-i18n="🔴 未读">🔴 未读</button>
                <button class="btn btn-secondary" id="btnFeedAllRead" data-i18n="✓ 全部已读">✓ 全部已读</button>
              </div>
              <div class="feeds-toolbar-right">
                <input type="url" id="feedAddInput" class="feed-add-input" placeholder="添加 RSS 源 URL..." data-i18n-ph="添加 RSS 源 URL..." autocomplete="off">
                <button class="btn btn-primary feed-add-btn" id="btnAddFeed" data-i18n="＋ 添加">＋ 添加</button>
              </div>
            </section>
            <div class="feeds-body">
              <aside class="feeds-source-list" id="feedSourceList"></aside>
              <section class="feeds-article-list" id="feedArticleList"></section>
            </div>
          </div>
        </div>

        <!-- ================= PANE 3: NOTES VIEW (其他内容/笔记库双栏区域) ================= -->
        <div class="view-pane" id="paneNotes">
          <div class="notes-workspace">
            <!-- Left sub-pane: Note list -->
            <section class="notes-pane-list" id="notesPaneList">
              <div class="notes-list-header">
                <div class="list-head-title">
                  <div class="eyebrow" id="notesEyebrow">VAULT EXPLORER</div>
                  <h1 class="notes-title" id="listTitle" data-i18n="全部笔记">全部笔记</h1>
                </div>
                <span class="result-count" id="resultCount">—</span>
                <button class="btn btn-primary note-add-btn" id="btnNewNote" data-i18n="＋ 新建笔记">＋ 新建笔记</button>
              </div>
              <div class="list-sub" id="listSub" data-i18n="从原始 vault 直接读取，保持文件不变">从原始 vault 直接读取，保持文件不变</div>

              <!-- Quick search inside list -->
              <div class="list-filter-bar">
                <input type="text" id="listFilterInput" class="list-filter-input" placeholder="在当前列表中快速过滤..." data-i18n-ph="在当前列表中快速过滤...">
              </div>

              <div id="noteList" class="notes-scroll-list"></div>
            </section>

            <!-- Right sub-pane: Note reader/editor -->
            <section class="notes-pane-reader" id="noteReader">
              <div class="empty-reader">
                <div class="empty-icon">◌</div>
                <h2 data-i18n="打开一篇笔记">打开一篇笔记</h2>
                <p data-i18n="在左侧列表中选择笔记，开始浏览或编辑。">在左侧列表中选择笔记，开始浏览或编辑。</p>
                <div class="shortcut-hint" data-i18n="快捷键：⌘ K 搜索 · 点击左侧卡片打开">快捷键：⌘ K 搜索 · 点击左侧卡片打开</div>
              </div>
            </section>
          </div>
        </div>

        <!-- ================= PANE 4: CHAT VIEW (知识库智能问答 RAG 对话区域) ================= -->
        <div class="view-pane" id="paneChat">
          <div class="chat-workspace">
            <!-- Chat Topbar Controls -->
            <div class="chat-header">
              <div class="chat-header-left">
                <div class="eyebrow">RAG KNOWLEDGE ASSISTANT</div>
                <h2 data-i18n="知识库智能问答">知识库智能问答</h2>
              </div>
              <div class="chat-header-controls">
                <div class="control-group">
                  <label class="control-label" for="chatModelInput" data-i18n="模型:">模型:</label>
                  <div class="chat-model-wrap">
                    <input id="chatModelInput" class="chat-select" placeholder="正在读取可用模型…" autocomplete="off" spellcheck="false">
                    <div id="chatModelDropdown" class="chat-model-dropdown" hidden></div>
                  </div>
                </div>
                <div class="control-group">
                  <label class="control-label" for="chatScopeSelect" data-i18n="检索范围:">检索范围:</label>
                  <select id="chatScopeSelect" class="chat-select">
                    <option value="" data-i18n="全知识库">全知识库</option>
                  </select>
                </div>
                <button class="btn btn-secondary chat-btn" id="btnClearChat" title="清空当前对话" data-i18n="🧹 清空记录">🧹 清空记录</button>
              </div>
            </div>

            <!-- Messages Area -->
            <div class="chat-messages-container" id="chatMessages">
              <!-- Rendered by renderChatView() -->
            </div>

            <!-- Input Bar -->
            <div class="chat-input-wrapper">
              <div class="chat-suggestions-bar" id="chatSuggestionsBar">
                <span class="sug-hint" data-i18n="推荐提问:">推荐提问:</span>
                <button class="sug-pill" data-prompt="总结最近一周的重点笔记"><span data-i18n="📋 周重点总结">📋 周重点总结</span></button>
                <button class="sug-pill" data-prompt="列出最近需要跟进的待办事项"><span data-i18n="✅ 待办跟进">✅ 待办跟进</span></button>
                <button class="sug-pill" data-prompt="根据当前知识库整理一个主题索引"><span data-i18n="🧭 主题索引">🧭 主题索引</span></button>
              </div>
              <form class="chat-input-form" id="chatInputForm">
                <textarea id="chatInputText" class="chat-textarea" placeholder="输入你想咨询知识库的问题... (支持多轮连续追问，Enter 发送，Shift+Enter 换行)" data-i18n-ph="输入你想咨询知识库的问题... (支持多轮连续追问，Enter 发送，Shift+Enter 换行)" rows="2"></textarea>
                <button type="submit" class="chat-send-btn" id="btnSendChat" title="发送提问">
                  <span class="send-icon">➤</span>
                  <span class="send-text" data-i18n="发送">发送</span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- ================= PANE 6: SETTINGS VIEW (网页配置) ================= -->
        <div class="view-pane" id="paneSettings">
          <div class="settings-workspace" id="settingsContainer">
            <!-- Rendered by renderSettingsView() -->
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Modal / Dialog for Edit Task -->
  <dialog id="taskModal" class="task-modal">
    <form method="dialog" id="taskModalForm" class="task-modal-form">
      <div class="modal-head">
        <h3 id="taskModalTitle" data-i18n="编辑待办事项">编辑待办事项</h3>
        <button type="button" class="modal-close" id="closeTaskModal">×</button>
      </div>
      <div class="modal-body">
        <label class="form-label" data-i18n="事项内容与标签">事项内容与标签</label>
        <textarea id="taskModalInput" class="task-modal-textarea" rows="3" placeholder="事项内容..." data-i18n-ph="事项内容..."></textarea>
        <div class="modal-tag-chips" id="taskModalTagChips"></div>
      </div>
      <div class="modal-foot" style="display:flex;justify-content:space-between;align-items:center">
        <button type="button" class="btn" id="deleteTaskFromModal" style="color:var(--danger);border-color:#fca5a5" data-i18n="🗑 删除此事项">🗑 删除此事项</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn btn-secondary" id="cancelTaskModal" data-i18n="取消">取消</button>
          <button type="submit" class="btn btn-primary" id="saveTaskModal" data-i18n="保存更改">保存更改</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- Modal / Dialog for New Note -->
  <dialog id="noteModal" class="task-modal">
    <form method="dialog" id="noteModalForm" class="task-modal-form">
      <div class="modal-head">
        <h3 data-i18n="＋ 新建笔记">＋ 新建笔记</h3>
        <button type="button" class="modal-close" id="closeNoteModal">×</button>
      </div>
      <div class="modal-body">
        <label class="form-label" data-i18n="标题">标题</label>
        <input type="text" id="noteTitleInput" class="task-modal-input" placeholder="笔记标题" data-i18n-ph="笔记标题" autocomplete="off">
        <label class="form-label" data-i18n="存放位置">存放位置</label>
        <select id="noteFolderSelect" class="chat-select note-folder-select">
          <option value="" data-i18n="正在读取 vault 目录…">正在读取 vault 目录…</option>
        </select>
        <label class="form-label" data-i18n="正文（Markdown）">正文（Markdown）</label>
        <textarea id="noteBodyInput" class="task-modal-textarea" rows="10" placeholder="正文内容..." data-i18n-ph="正文内容..."></textarea>
      </div>
      <div class="modal-foot" style="display:flex;justify-content:flex-end;gap:8px">
        <button type="button" class="btn btn-secondary" id="cancelNoteModal" data-i18n="取消">取消</button>
        <button type="submit" class="btn btn-primary" id="saveNoteModal" data-i18n="＋ 创建">＋ 创建</button>
      </div>
    </form>
  </dialog>

  <!-- Modal / Dialog for Directory Picker -->
  <dialog id="dirPickerModal" class="task-modal">
    <div class="task-modal-form">
      <div class="modal-head">
        <h3 data-i18n="📂 选择目录">📂 选择目录</h3>
        <button type="button" class="modal-close" id="closeDirPicker">×</button>
      </div>
      <div class="modal-body">
        <div class="dir-picker-path" id="dirPickerPath"></div>
        <div class="dir-picker-list" id="dirPickerList"></div>
      </div>
      <div class="modal-foot dir-picker-foot">
        <button type="button" class="btn btn-secondary" id="dirPickerUp" data-i18n="⬆ 上级">⬆ 上级</button>
        <button type="button" class="btn btn-secondary" id="dirPickerHome" data-i18n="🏠 主目录">🏠 主目录</button>
        <span class="dir-picker-spacer"></span>
        <button type="button" class="btn btn-secondary" id="dirPickerCancel" data-i18n="取消">取消</button>
        <button type="button" class="btn btn-primary" id="dirPickerSelect" data-i18n="选择此目录">选择此目录</button>
      </div>
    </div>
  </dialog>

  <!-- Sidebar drawer backdrop (mobile only) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <script src="/app.js"></script>
</body>
</html>
